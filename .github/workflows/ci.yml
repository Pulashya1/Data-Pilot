name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: datapilot
          POSTGRES_PASSWORD: datapilot
          POSTGRES_DB: datapilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datapilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Start MinIO
        # GitHub Actions `services:` can't override a container's command, so MinIO
        # (which needs `server /data`) is started directly instead of as a service.
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          until curl -sf http://localhost:9000/minio/health/live; do sleep 1; done
      - name: Create test database
        env:
          PGPASSWORD: datapilot
        run: psql -h localhost -U datapilot -d datapilot -c "CREATE DATABASE datapilot_test"
      - name: Apply migrations (validates they run cleanly)
        env:
          DATABASE_URL: postgresql+asyncpg://datapilot:datapilot@localhost:5432/datapilot_test
        run: alembic upgrade head
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy)
        run: mypy app
      - name: Test
        env:
          LLM_MODEL: mock
          TEST_DATABASE_URL: postgresql+asyncpg://datapilot:datapilot@localhost:5432/datapilot_test
        run: pytest

  kernel:
    # Real-Docker kernel/relay integration tests (MASTER_PROMPT.md §3, §9, §10), kept out of
    # the `backend` job so the fast unit-test path (which uses a fake execution backend)
    # doesn't pay for building the full data-science kernel image on every push.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Build kernel image
        run: docker build -t datapilot-kernel:latest kernel_image/
      - name: Build relay image
        run: docker build -t datapilot-kernel-relay:latest relay_image/
      - name: Test (Docker-marked)
        run: pytest -m docker -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
