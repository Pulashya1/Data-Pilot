[project]
name = "datapilot-backend"
version = "0.1.0"
description = "DataPilot backend: agentic EDA & feature engineering assistant API"
# numpy==2.5.3 below has no Python 3.11 build (requires >=3.12); MASTER_PROMPT.md §2 says
# "3.11+" but that's no longer actually satisfiable — see backend/Dockerfile's matching pin.
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.35",
    "alembic==1.13.3",
    "asyncpg==0.29.0",
    "redis==5.0.8",
    "arq==0.26.1",
    "boto3==1.43.95",
    "python-multipart==0.0.9",
    "structlog==24.4.0",
    "pandas==3.0.5",
    "numpy==2.5.3",
    "pyarrow==25.0.1",
    "openpyxl==3.1.5",
    "charset-normalizer==3.5.1",
    "docker==7.1.0",
    "jupyter-client==8.6.3",
    "nbformat==5.10.4",
    "litellm==1.101.0",
    "langgraph==1.2.11",
    "langgraph-checkpoint-postgres==3.1.2",
    "psycopg[binary,pool]==3.3.5",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "httpx==0.28.1",
    "ruff==0.6.8",
    "mypy==1.11.2",
    # Only needed to `exec()` rendered analysis templates directly in tests (no Docker);
    # the sandboxed kernel image (backend/kernel_image/) pins its own, separate versions.
    "matplotlib==3.10.0",
    "seaborn==0.13.2",
    "scipy==1.16.3",
    # 0.14.4 (still fine for the kernel image's older pandas 2.2.3, kernel_image/requirements.txt)
    # calls pandas' deprecate_kwarg with its pre-3.0 2-arg signature; pandas 3.0.5 here requires
    # a leading `klass` arg, which breaks statsmodels.tsa.stattools / stats.diagnostic / api at
    # import time. 0.15.0 is the first release built against pandas 3.x.
    "statsmodels==0.15.0",
    "scikit-learn==1.5.1",
    "ipython==8.27.0",
    # Phase 6 (feature_engineering/baseline_model templates, MASTER_PROMPT.md §12). joblib is
    # already a transitive dependency of scikit-learn, but both templates `import joblib`
    # directly, so it gets its own explicit pin here too.
    "joblib==1.4.2",
    # shap==0.46.0 (kernel_image/requirements.txt's pin, fine against its older numpy==1.26.4)
    # crashes on `import shap` here: numpy 2.5.3 changed `np.dtype(np.floating)` handling,
    # which shap 0.46's `plots/colors/_colorconv.py` hits at *module import time* computing a
    # color constant — unrelated to anything this project calls. 0.52.0 is numpy-2-compatible.
    "shap==0.52.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

# These are untyped (no inline annotations, no stubs); treat their exports as Any rather
# than erroring on every untyped call.
[[tool.mypy.overrides]]
module = ["nbformat.*", "jupyter_client.*", "docker.*"]
follow_imports = "skip"

# litellm and langgraph* ship their own types, but they're large enough that following mypy
# into their internals makes `mypy app` minutes slower for no benefit here — skip and treat
# as Any, same as the untyped deps above.
[[tool.mypy.overrides]]
module = ["litellm.*", "langgraph.*", "psycopg.*", "psycopg_pool.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# `docker`-marked tests need real Docker + the kernel/relay images built; excluded from the
# default run (see CLAUDE.md), run explicitly with `pytest -m docker`.
addopts = "-m 'not docker'"
markers = ["docker: needs Docker and the built datapilot-kernel(-relay) images"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
