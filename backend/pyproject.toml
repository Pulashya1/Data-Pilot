[project]
name = "datapilot-backend"
version = "0.1.0"
description = "DataPilot backend: agentic EDA & feature engineering assistant API"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "sqlalchemy==2.0.35",
    "alembic==1.13.3",
    "asyncpg==0.29.0",
    "redis==5.0.8",
    "arq==0.26.1",
    "boto3==1.35.24",
    "python-multipart==0.0.9",
    "structlog==24.4.0",
    "pandas==3.0.5",
    "numpy==2.5.3",
    "pyarrow==25.0.1",
    "openpyxl==3.1.5",
    "charset-normalizer==3.5.1",
    "docker==7.1.0",
    "jupyter-client==8.6.3",
    "nbformat==5.10.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "httpx==0.27.2",
    "ruff==0.6.8",
    "mypy==1.11.2",
    # Only needed to `exec()` rendered analysis templates directly in tests (no Docker);
    # the sandboxed kernel image (backend/kernel_image/) pins its own, separate versions.
    "matplotlib==3.10.0",
    "seaborn==0.13.2",
    "scipy==1.16.3",
    "statsmodels==0.14.4",
    "ipython==8.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

# These are untyped (no inline annotations, no stubs); treat their exports as Any rather
# than erroring on every untyped call.
[[tool.mypy.overrides]]
module = ["nbformat.*", "jupyter_client.*", "docker.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# `docker`-marked tests need real Docker + the kernel/relay images built; excluded from the
# default run (see CLAUDE.md), run explicitly with `pytest -m docker`.
addopts = "-m 'not docker'"
markers = ["docker: needs Docker and the built datapilot-kernel(-relay) images"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
