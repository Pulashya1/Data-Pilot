services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: datapilot
      POSTGRES_PASSWORD: datapilot
      POSTGRES_DB: datapilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datapilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Docker Hub's `minio/minio` repo now rejects anonymous pulls ("pull access denied") —
    # MinIO also publishes the same images to Quay.io, which still allows anonymous pulls.
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    # Runs real analysis/agent code too (not just mock), spawning sibling kernel/relay
    # containers via the host's Docker socket (mounted below) — see CLAUDE.md's "Full stack"
    # section and docker_backend.py's module docstring for how the per-session connection
    # file/dataset reach those sibling containers without a host bind mount.
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://datapilot:datapilot@postgres:5432/datapilot
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      # app/execution/docker_backend.py connects to the sandboxed kernel via a connection
      # file whose "ip" must resolve to the Docker *host* from inside this container (its own
      # 127.0.0.1 is its own loopback, not the host's — see Settings.kernel_host_address).
      KERNEL_HOST_ADDRESS: host.docker.internal
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      # "Docker-out-of-Docker": the backend spawns sibling kernel/relay containers via the
      # Docker SDK (app/execution/docker_backend.py), which needs the host's Docker socket.
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      # Docker Desktop (Windows/Mac) already resolves this; native Linux Docker Engine
      # (20.10+) needs this explicit mapping to the host gateway.
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
